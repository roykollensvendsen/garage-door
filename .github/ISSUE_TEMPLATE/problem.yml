name: Something is wrong
description: A bug, a wrong fact in the docs, or something unsafe.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **If the door did something unsafe**, unplug the opener first, then tell us here.
        Never paste keys, passwords or `secrets.yaml`.
  - type: textarea
    id: what
    attributes: {label: "What happened, and what did you expect?"}
    validations: {required: true}
  - type: textarea
    id: log
    attributes: {label: The log lines, description: "From presses.jsonl or simulated.jsonl, if there are any.", render: json}
  - type: input
    id: opener
    attributes: {label: Opener model, placeholder: "LiftMaster LM80EVF, or simulated"}
