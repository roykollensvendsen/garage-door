<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 342" width="820" height="342" font-family="sans-serif" font-size="13">
<title>Isolated input: 6N136</title>
<style>.v{font-size:12px;text-anchor:middle}.l{font-size:13px}.s{font-size:11px;fill:#444}.h{font-size:16px;font-weight:bold}</style>
<rect width="820" height="342" fill="#fff"/>
<text x="20" y="28" class="h">Isolated input on the opener's data wire: 6N136 (proposed)</text>
<text x="90" y="78" class="v">Terminal 0</text>
<circle cx="90" cy="90" r="5" fill="#222"/>
<polyline points="90,90 130,90" fill="none" stroke="#222" stroke-width="2"/>
<rect x="130" y="81" width="60" height="18" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="160" y="76" class="v">10k</text>
<polyline points="190,90 300,90" fill="none" stroke="#222" stroke-width="2"/>
<text x="294" y="84" class="s" text-anchor="end">2 (anode)</text>
<polyline points="300,170 90,170" fill="none" stroke="#222" stroke-width="2"/>
<text x="294" y="164" class="s" text-anchor="end">3 (cathode)</text>
<circle cx="90" cy="170" r="5" fill="#222"/>
<text x="90" y="192" class="v">Terminal 2</text>
<polyline points="230,90 230,120" fill="none" stroke="#222" stroke-width="2"/>
<polygon points="220,140 240,140 230,122" fill="#222"/>
<polyline points="220,122 240,122" fill="none" stroke="#222" stroke-width="3"/>
<polyline points="230,140 230,170" fill="none" stroke="#222" stroke-width="2"/>
<text x="236" y="136" class="s">1N4148</text>
<rect x="300" y="60" width="120" height="140" fill="#f4f4f4" stroke="#222"/>
<text x="360" y="134" class="v">6N136</text>
<text x="360" y="150" class="s" text-anchor="middle">isolation</text>
<polyline points="358,60 358,200" fill="none" stroke="#999" stroke-width="1"/>
<polyline points="420,80 540,80" fill="none" stroke="#222" stroke-width="2"/>
<text x="426" y="74" class="s">8 (VCC) to 3V3</text>
<polyline points="420,130 620,130" fill="none" stroke="#222" stroke-width="2"/>
<text x="426" y="124" class="s">6 (output)</text>
<polyline points="540,80 540,95" fill="none" stroke="#222" stroke-width="2"/>
<rect x="531" y="95" width="18" height="30" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="554" y="114" class="s">22k</text>
<text x="625" y="134" class="l">GPIO36 (VP), inverted</text>
<polyline points="420,180 540,180" fill="none" stroke="#222" stroke-width="2"/>
<text x="426" y="174" class="s">5 (GND) to ESP32 GND</text>
<text x="426" y="196" class="s">100n from pin 8 to pin 5; pin 7 open</text>
<text x="20" y="250" class="s">LED current 0.97 mA at 11.2 V, 1.35 mA at 15 V: the load on the bus.</text>
<text x="20" y="268" class="s">Line high -> LED on -> output low: set inverted: true on the UART's rx_pin.</text>
<text x="20" y="286" class="s">Output must go below 0.8 V; if not, a second resistor in parallel with the first.</text>
<text x="20" y="304" class="s">Isolated: the ESP32's ground never touches the opener's.</text>
</svg>
