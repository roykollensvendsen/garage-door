<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" font-family="sans-serif" font-size="13">
<title>Bench divider: schematic</title>
<style>.v{font-size:12px;text-anchor:middle}.l{font-size:13px}.s{font-size:11px;fill:#444}.h{font-size:16px;font-weight:bold}</style>
<rect width="720" height="480" fill="#fff"/>
<text x="20" y="28" class="h">Bench test: listen on the opener's data wire (0+2)</text>
<text x="250" y="62" class="l" text-anchor="end">Opener terminal 0</text>
<circle cx="260" cy="70" r="5" fill="#222"/>
<polyline points="260,70 260,90" fill="none" stroke="#222" stroke-width="2"/>
<rect x="251" y="90" width="18" height="50" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="276" y="120" class="l">22k</text>
<polyline points="260,140 260,160" fill="none" stroke="#222" stroke-width="2"/>
<rect x="251" y="160" width="18" height="50" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="276" y="190" class="l">10k</text>
<polyline points="260,210 260,230" fill="none" stroke="#222" stroke-width="2"/>
<circle cx="260" cy="230" r="5" fill="#222"/>
<text x="248" y="234" class="l" text-anchor="end">node A</text>
<polyline points="260,230 260,250" fill="none" stroke="#222" stroke-width="2"/>
<rect x="251" y="250" width="18" height="50" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="276" y="280" class="l">10k</text>
<polyline points="260,300 260,330" fill="none" stroke="#222" stroke-width="2"/>
<polyline points="242,330 278,330" fill="none" stroke="#222" stroke-width="3"/>
<text x="238" y="350" class="l" text-anchor="end">Opener terminal 2 = ESP32 GND</text>
<polyline points="260,230 300,230" fill="none" stroke="#222" stroke-width="2"/>
<rect x="300" y="221" width="50" height="18" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="325" y="216" class="v">1k</text>
<polyline points="350,230 480,230" fill="none" stroke="#222" stroke-width="2"/>
<circle cx="420" cy="230" r="4" fill="#222"/>
<polyline points="420,230 420,200" fill="none" stroke="#222" stroke-width="2"/>
<polygon points="410,200 430,200 420,182" fill="#222"/>
<polyline points="410,182 430,182" fill="none" stroke="#222" stroke-width="3"/>
<polyline points="420,182 420,150" fill="none" stroke="#222" stroke-width="2"/>
<text x="420" y="144" class="v">3V3</text>
<text x="436" y="194" class="l">1N4148</text>
<polyline points="420,230 420,270" fill="none" stroke="#222" stroke-width="2"/>
<polyline points="408,270 432,270" fill="none" stroke="#222" stroke-width="3"/>
<polyline points="408,276 432,276" fill="none" stroke="#222" stroke-width="3"/>
<polyline points="420,276 420,300" fill="none" stroke="#222" stroke-width="2"/>
<text x="428" y="296" class="l">100p (optional) to GND</text>
<rect x="480" y="190" width="130" height="80" fill="#f4f4f4" stroke="#222"/>
<text x="545" y="212" class="v">SparkFun</text>
<text x="545" y="228" class="v">ESP32 Thing</text>
<text x="486" y="252" class="l">GPIO36 (VP)</text>
<text x="20" y="400" class="s">Ratio 0.238. Load 42 kOhm, 0.29 mA at 12 V.</text>
<text x="20" y="418" class="s">Node A: 2.67 V at 11.2 V, 2.86 V at 12 V, 3.57 V at 15 V.</text>
<text x="20" y="436" class="s">ESP32 reads high above 2.48 V; absolute maximum 3.6 V (clamp through 1k).</text>
<text x="20" y="454" class="s">Not isolated: run the laptop on battery for this test.</text>
