<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" width="720" height="410" font-family="sans-serif" font-size="13">
<title>Bench divider: schematic</title>
<style>.v{font-size:12px;text-anchor:middle}.l{font-size:13px}.s{font-size:11px;fill:#444}.h{font-size:16px;font-weight:bold}</style>
<rect width="720" height="410" fill="#fff"/>
<text x="20" y="28" class="h">Bench test: listen on the opener's data wire (0+2)</text>
<text x="250" y="62" class="l" text-anchor="end">Opener terminal 0</text>
<circle cx="260" cy="70" r="5" fill="#222"/>
<polyline points="260,70 260,90" fill="none" stroke="#222" stroke-width="2"/>
<rect x="251" y="90" width="18" height="50" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="276" y="120" class="l">22k</text>
<polyline points="260,140 260,160" fill="none" stroke="#222" stroke-width="2"/>
<circle cx="260" cy="160" r="5" fill="#222"/>
<text x="248" y="164" class="l" text-anchor="end">node A</text>
<polyline points="260,160 260,180" fill="none" stroke="#222" stroke-width="2"/>
<rect x="251" y="180" width="18" height="50" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="276" y="210" class="l">10k</text>
<polyline points="260,230 260,260" fill="none" stroke="#222" stroke-width="2"/>
<polyline points="242,260 278,260" fill="none" stroke="#222" stroke-width="3"/>
<text x="238" y="280" class="l" text-anchor="end">Opener terminal 2 = ESP32 GND</text>
<polyline points="260,160 300,160" fill="none" stroke="#222" stroke-width="2"/>
<rect x="300" y="151" width="50" height="18" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="325" y="146" class="v">1k</text>
<polyline points="350,160 480,160" fill="none" stroke="#222" stroke-width="2"/>
<circle cx="420" cy="160" r="4" fill="#222"/>
<polyline points="420,160 420,130" fill="none" stroke="#222" stroke-width="2"/>
<polygon points="410,130 430,130 420,112" fill="#222"/>
<polyline points="410,112 430,112" fill="none" stroke="#222" stroke-width="3"/>
<polyline points="420,112 420,80" fill="none" stroke="#222" stroke-width="2"/>
<text x="420" y="74" class="v">3V3</text>
<text x="436" y="124" class="l">1N4148</text>
<polyline points="420,160 420,200" fill="none" stroke="#222" stroke-width="2"/>
<polyline points="408,200 432,200" fill="none" stroke="#222" stroke-width="3"/>
<polyline points="408,206 432,206" fill="none" stroke="#222" stroke-width="3"/>
<polyline points="420,206 420,230" fill="none" stroke="#222" stroke-width="2"/>
<text x="428" y="226" class="l">1n (optional) to GND</text>
<rect x="480" y="120" width="130" height="80" fill="#f4f4f4" stroke="#222"/>
<text x="545" y="142" class="v">SparkFun</text>
<text x="545" y="158" class="v">ESP32 Thing</text>
<text x="486" y="182" class="l">GPIO36 (VP)</text>
<text x="20" y="330" class="s">Ratio 0.312. Load 32 kOhm, 0.38 mA at 12 V.</text>
<text x="20" y="348" class="s">Node A: 3.16 V at 10.1 V, 3.75 V at 12 V, 4.69 V at 15 V.</text>
<text x="20" y="366" class="s">ESP32 reads high above 2.48 V. At 15 V the 1N4148 holds GPIO36 near 3.9 V, 0.10 mA into 3V3.</text>
<text x="20" y="384" class="s">Filter 1n: 8 us against a 250 us bit.</text>
<text x="20" y="402" class="s">Not isolated: power the ESP32 from a USB power bank, not the laptop.</text>
</svg>
