<text x="835" y="100" class="v" fill="#fff">ESP32 Thing</text>
<text x="776" y="148" class="s" fill="#fff">GPIO36 / VP</text>
<polyline points="720,60 770,60" fill="none" stroke="#d22" stroke-width="4"/>
<text x="776" y="64" class="s" fill="#fff">3V3</text>
<polyline points="720,260 770,260" fill="none" stroke="#222" stroke-width="4"/>
<text x="776" y="264" class="s" fill="#fff">GND</text>
<rect x="430" y="290" width="120" height="56" rx="6" fill="#ffd400" stroke="#333"/>
<text x="490" y="312" class="v">DC volts</text>
<text x="490" y="332" class="v">~2.67 V</text>
<polyline points="530,290 364,154" fill="none" stroke="#d22" stroke-width="2"/>
<polyline points="450,290 400,260" fill="none" stroke="#222" stroke-width="2"/>
<text x="556" y="312" class="s">red probe on node A,</text>
<text x="556" y="328" class="s">black probe on the GND rail</text>
<text x="20" y="390" class="s">22k: red-red-orange-gold  (5 %)   or  red-red-black-red-brown  (1 %)</text>
<text x="20" y="408" class="s">10k: brown-black-orange-gold  (5 %)   or  brown-black-black-red-brown  (1 %)</text>
<text x="20" y="426" class="s">1k: brown-black-red-gold  (5 %)   or  brown-black-black-brown-brown  (1 %)</text>
<text x="20" y="444" class="s">Check before the ESP32 is connected: node A to terminal 2 reads about 2.67 V at 11.2 V idle, never above 3.57 V, never negative.</text>
<text x="20" y="462" class="s">Optional 100p from GPIO36 to GND. Not isolated: laptop on battery.</text>
</svg>
