<text x="20" y="446" class="s">1k: brown-black-red-gold  (5 %)   or  brown-black-black-brown-brown  (1 %)</text>
<text x="20" y="464" class="s">Check before the ESP32 is connected: node A to terminal 2 reads about 2.67 V at 11.2 V idle, never above 3.57 V, never negative.</text>
<text x="20" y="482" class="s">Optional 100p from GPIO36 to GND. Not isolated: ESP32 on a USB power bank, not the laptop.</text>
