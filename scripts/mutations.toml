# Every rule this project enforces, and the one line that carries it.
#
# A rule nothing catches is a rule nothing protects. `scripts/mutate.py` turns
# each of these off in turn and runs the suite; a rule whose removal breaks no
# test has no test. Add a test of your own that counts the rules in the source
# against the rows here, so this list cannot fall behind.
#
# `find` is a regular expression matching the single line to replace; `replace`
# is what replaces it, keeping the file valid. The line's own indentation is
# kept, so do not write indentation here. `replace` takes the WHOLE line, not
# just the part `find` matched: a partial line breaks the file, every test
# fails at import, and the rule reads "BY LUCK" instead of "KILLED".
#
# [[rule]]
# name = "what the rule says, in words"
# file = "src/garage_door/somewhere.py"
# find = 'if limit_exceeded:'
# replace = 'if False:'

[[rule]]
name = "a press is refused when the door state is not known"
file = "src/garage_door/service.py"
find = 'if state not in KNOWN:'
replace = 'if False:'

[[rule]]
name = "a request the door already satisfies is refused"
file = "src/garage_door/service.py"
find = 'if state is action\.end_state:'
replace = 'if False:'

[[rule]]
name = "closing is refused when it is switched off"
file = "src/garage_door/service.py"
find = 'if action is Action\.CLOSE and not self\._allow_close:'
replace = 'if False:'

[[rule]]
name = "a token works once"
file = "src/garage_door/service.py"
find = 'pending, self\._pending = self\._pending, None'
replace = 'pending = self._pending'

[[rule]]
name = "a switch token works once"
file = "src/garage_door/switches.py"
find = 'pending, self\._pending = self\._pending, None'
replace = 'pending = self._pending'

[[rule]]
name = "a switch token expires after thirty seconds"
file = "src/garage_door/switches.py"
find = 'if self\._clock\(\) - asked_at >= TOKEN_SECONDS:'
replace = 'if False:'

[[rule]]
name = "without the right phrase the question is asked as before"
file = "src/garage_door/service.py"
find = 'if self\._phrases is not None and self\._phrases\.matches\(action, phrase\):'
replace = 'if self._phrases is not None:'

[[rule]]
name = "the whole phrase must be there in order"
file = "src/garage_door/phrases.py"
find = 'if sum\(_slips\(s, w\) for s, w in zip\(window, phrase, strict=True\)\) <= 1:'
replace = 'if sum(_slips(s, w) for s, w in zip(window, phrase, strict=True)) <= 99:'

[[rule]]
name = "a phrase works only for its own action"
file = "src/garage_door/phrases.py"
find = 'return any\(_found_in\(heard, phrase\) for phrase in self\.by_action\.get\(action, \(\)\)\)'
replace = 'return any(_found_in(heard, phrase) for listed in self.by_action.values() for phrase in listed)'

[[rule]]
name = "a phrase file others can read is refused"
file = "src/garage_door/phrases.py"
find = 'if path\.stat\(\)\.st_mode & \(stat\.S_IRWXG \| stat\.S_IRWXO\):'
replace = 'if False:'

[[rule]]
name = "a token expires after thirty seconds"
file = "src/garage_door/service.py"
find = 'if self\._clock\(\) - pending\.asked_at >= TOKEN_SECONDS:'
replace = 'if False:'

[[rule]]
name = "a press is refused when the door changed since the question"
file = "src/garage_door/service.py"
find = 'if before is not pending\.state:'
replace = 'if False:'

[[rule]]
name = "every request and press is logged"
file = "src/garage_door/service.py"
find = 'log\.write\(json\.dumps\(entry\) \+ "\\n"\)'
replace = 'pass'


# --- The controller's own rules (firmware/door_logic/door_logic.h) ----------
# `suite = "firmware"` builds and runs the GoogleTest suite instead of pytest.
# The test that must go red is the rule's words in CamelCase, split between
# the TEST's suite and name: "press is refused when ..." is Press.IsRefusedWhen...

[[rule]]
name = "press is refused when the door state is unknown"
suite = "firmware"
file = "firmware/door_logic/door_logic.h"
find = 'if \(state_ != DoorState::Closed && state_ != DoorState::Open\) \{'
replace = 'if (false) {'

[[rule]]
name = "press is refused when open and closing is not allowed"
suite = "firmware"
file = "firmware/door_logic/door_logic.h"
find = 'if \(state_ == DoorState::Open && !config_\.allow_close\) \{'
replace = 'if (false) {'

[[rule]]
name = "pulse cannot be restarted while it is on"
suite = "firmware"
file = "firmware/door_logic/door_logic.h"
find = 'if \(pressed_ && \(now - press_start_\) < config_\.pulse_ms\) \{'
replace = 'if (false) {'

[[rule]]
name = "pulse a second press within two seconds is refused"
suite = "firmware"
file = "firmware/door_logic/door_logic.h"
find = 'if \(pressed_ && \(now - press_start_\) < config_\.min_gap_ms\) \{'
replace = 'if (false) {'

[[rule]]
name = "pulse is off at half a second"
suite = "firmware"
file = "firmware/door_logic/door_logic.h"
find = 'return pressed_ && \(now - press_start_\) < config_\.pulse_ms;'
replace = 'return pressed_ && (now - press_start_) < config_.min_gap_ms;'

[[rule]]
name = "pulse does not come back on when the clock wraps around later"
suite = "firmware"
file = "firmware/door_logic/door_logic.h"
find = 'if \(pressed_ && \(now - press_start_\) >= config_\.min_gap_ms\) \{'
replace = 'if (false && now) {'

[[rule]]
name = "door state is a fault when both sensors see a magnet at once"
suite = "firmware"
file = "firmware/door_logic/door_logic.h"
find = 'if \(at_closed && at_open\) \{'
replace = 'if (false) {'

[[rule]]
name = "door state becomes unknown when neither end is reached within the travel time"
suite = "firmware"
file = "firmware/door_logic/door_logic.h"
find = 'const bool within_travel = seen_at_end_ && \(now - last_at_end_\) < config_\.travel_ms;'
replace = 'const bool within_travel = seen_at_end_;'

# --- The opener's data wire (firmware/door_logic/opener_wire.h, ADR-GD-003) ---

[[rule]]
name = "wire state is unknown when the last status is older than its limit"
suite = "firmware"
file = "firmware/door_logic/door_logic.h"
find = 'if \(age >= limit\) \{'
replace = 'if (false && limit) {'

[[rule]]
name = "wire state is unknown when a damaged packet came after the last status"
suite = "firmware"
file = "firmware/door_logic/door_logic.h"
find = 'if \(damaged\) \{'
replace = 'if (false && damaged) {'

[[rule]]
name = "wire state is unknown when a moving door was last heard longer ago than the travel time"
suite = "firmware"
file = "firmware/door_logic/door_logic.h"
find = 'if \(moving && age >= config_\.travel_ms\) \{'
replace = 'if (false && moving) {'

[[rule]]
name = "listener marks damage after the last status until the next one"
suite = "firmware"
file = "firmware/door_logic/opener_wire.h"
find = 'if \(framer_\.stray\(\) != stray_before\) \{'
replace = 'if (false && stray_before) {'

[[rule]]
name = "wire press opens a closed door and closes an open one"
suite = "firmware"
file = "firmware/door_logic/door_logic.h"
find = 'wire_action_ = state_ == DoorState::Closed \? WireAction::Open : WireAction::Close;'
replace = 'wire_action_ = WireAction::Open;'

[[rule]]
name = "wire reads only status packets as the door state"
suite = "firmware"
file = "firmware/door_logic/opener_wire.h"
find = 'if \(command != kStatus\) \{'
replace = 'if (false) {'

[[rule]]
name = "rolling code is saved before a code past the saved one is sent"
suite = "firmware"
file = "firmware/door_logic/rolling_code.h"
find = 'bool save_due\(\) const \{ return .*'
replace = 'bool save_due() const { return false; }'

[[rule]]
name = "pulse stays off while the controller is not armed"
suite = "firmware"
file = "firmware/door_logic/door_logic.h"
find = 'if \(!config_\.armed\) \{'
replace = 'if (false) {'

[[rule]]
name = "manual mode switches itself off after ten minutes"
suite = "firmware"
file = "firmware/door_logic/door_logic.h"
find = 'return manual_on_ && \(now - manual_since_\) < config_\.manual_ms;'
replace = 'return manual_on_ || now == manual_since_;'

[[rule]]
name = "manual press is refused when manual mode is off"
suite = "firmware"
file = "firmware/door_logic/door_logic.h"
find = 'if \(!manual\(now\)\) \{'
replace = 'if (false) {'

[[rule]]
name = "manual press is refused while the controller is not armed"
suite = "firmware"
file = "firmware/door_logic/door_logic.h"
find = 'if \(!armed\(\)\) \{'
replace = 'if (false) {'

[[rule]]
name = "manual press is refused while the door is known to be moving"
suite = "firmware"
file = "firmware/door_logic/door_logic.h"
find = 'if \(state_ == DoorState::Moving\) \{'
replace = 'if (false) {'

[[rule]]
name = "a manual token works once"
file = "src/garage_door/manual.py"
find = 'if pending is None or not secrets\.compare_digest\(pending\[0\], token\):'
replace = 'if pending is None:'

[[rule]]
name = "a manual token expires after thirty seconds"
file = "src/garage_door/manual.py"
find = 'if self\._clock\(\) - asked_at >= TOKEN_SECONDS:'
replace = 'if False:'

[[rule]]
name = "a manual press is refused when the controller changed since the question"
file = "src/garage_door/manual.py"
find = 'if changed:'
replace = 'if False:'

[[rule]]
name = "a manual press is refused unless the controller is armed"
file = "src/garage_door/manual.py"
find = 'if report\["armed"\] is not True:'
replace = 'if False:'

[[rule]]
name = "a manual press is refused unless manual mode is on"
file = "src/garage_door/manual.py"
find = 'if report\["manual"\] is not True:'
replace = 'if False:'

[[rule]]
name = "a manual press is refused while the door is moving"
file = "src/garage_door/manual.py"
find = 'if report\["state"\] == DoorState\.MOVING:'
replace = 'if False:'

[[rule]]
name = "a press the controller refused is said as refused"
file = "src/garage_door/service.py"
find = 'if reason is not None:'
replace = 'if False:'

[[rule]]
name = "a manual press the controller refused is said as refused"
file = "src/garage_door/manual.py"
find = 'if reason is not None:'
replace = 'if False:'
