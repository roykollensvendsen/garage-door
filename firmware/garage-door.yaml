# SPDX-License-Identifier: GPL-3.0-or-later
#
# ESPHome configuration for the SparkFun ESP32 Thing that presses the
# LiftMaster LM80EVF's push-button input (terminals 1 and 2), reads the door
# state from two reed contacts or from the opener's data wire (terminals 0+2,
# decisions/ADR-GD-003), and logs every packet on that wire over Wi-Fi. The decisions live in door_logic/door_logic.h, which the
# laptop tests; this file only connects that logic to pins and the network.
#
# Check without hardware:  esphome config firmware/garage-door.yaml
# Secrets come from firmware/secrets.yaml (git-ignored); see secrets.example.yaml.

substitutions:
  # Roy, 2026-11-04: closing by voice is allowed. The opener reverses on its
  # own force limit as with the remote; photocells are recommended, not required.
  allow_close: "true"
  # Where the door state comes from: "reed" (contacts at each end) or "wire"
  # (the opener's own status on 0+2). The wire is logged either way.
  state_from: "wire"
  # With the state from the wire, how long the opener's last status is
  # trusted (decisions/ADR-GD-005): "last_status" for up to 6 minutes, with
  # safeguards; "ask_first" for 2 s only, which refuses every press until a
  # sender is fitted to ask the opener (ADR-GD-003).
  wire_trust: "last_status"
  # The press output's level. "false": a high pin closes the relay, as with the
  # AQY212EH. Roy's first-test module (Songle SRD-03VDC-SL-C board) may trigger
  # on a low input: set "true" only after the bench check in the build guide
  # shows it. Either way "off" is relay open, at boot and between presses.
  relay_active_low: "false"
  # The opener's data wire, listen-only: terminal 0 through the resistor
  # divider to this GPIO, ground on terminal 2 (docs/plan.md, "First bench
  # test"). Security+ 2.0 wireline at about 4000 baud, 8N1, idle high. Read by
  # door_logic/wire_uart.h, which never assigns a TX pin: nothing is sent.
  wire_rx_gpio: "36"
  # The wire's speed. Roy's scope captures (2026-11-04) and the first garage
  # run (2026-11-05 08:16) decoded at 4000 baud. After the opener was power
  # cycled at about 08:30, every packet arrived as 8 bytes starting 18/38/88/
  # 98 00: what a 4000-baud UART makes of a 19-byte packet sent at 9600, the
  # speed ratgdo uses for Security+ 2.0. Trying 9600.
  wire_baud: "9600"

esphome:
  name: garage-door
  friendly_name: Garage door
  on_boot:
    priority: 600
    then:
      - lambda: |-
          if (!garage_door::wire_uart().begin(${wire_rx_gpio}, ${wire_baud})) {
            ESP_LOGE("wire", "the wire's UART did not start: nothing will be heard on 0+2");
          }
  includes:
    - door_logic/door_logic.h
    - door_logic/wire_health.h
    - door_logic/rolling_code.h
    - door_logic/opener_wire.h
    - door_logic/esphome_glue.h
    - door_logic/wire_uart.h
    - third_party/secplus/secplus.h
    - third_party/secplus/secplus.c

esp32:
  board: esp32thing
  framework:
    type: esp-idf
    advanced:
      # Two app slots: an update goes into the idle one, and if it does not
      # boot and connect, the bootloader falls back to the slot that worked.
      # Needs both ota and safe_mode below.
      enable_ota_rollback: true
    sdkconfig_options:
      # Roy's board reports a 26 MHz main crystal (esptool, 2026-11-04);
      # ESP-IDF assumes 40 MHz, which garbles the serial log and Wi-Fi.
      CONFIG_XTAL_FREQ_26: y

# Logs go to USB serial when plugged in, and stream over the same encrypted
# API connection otherwise: `esphome logs firmware/garage-door.yaml`.
logger:
  logs:
    wire: INFO  # every packet on the opener's data wire

# Restart reason and free memory, for debugging over Wi-Fi.
debug:
  update_interval: 60s

# After repeated failed boots, start with only Wi-Fi and OTA so a fixed
# build can still be sent. Also what marks a new build as good for rollback.
safe_mode:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # No fallback access point and no captive portal: nothing to join or
  # configure from outside if the home network is down.

api:
  encryption:
    key: !secret api_encryption_key
  # The laptop is not always connected; never reboot for want of a client.
  reboot_timeout: 0s
  actions:
    # The only way to ask for a press. The logic may refuse it.
    - action: press
      then:
        - lambda: |-
            const auto result = garage_door::door(${allow_close}, "${wire_trust}").request_press(millis());
            id(last_press_result).publish_state(garage::to_string(result));
    # A press with no direction, while Roy watches the door (ADR-GD-004).
    # Refused unless armed and in manual mode.
    - action: manual_press
      then:
        - lambda: |-
            const auto result = garage_door::door(${allow_close}, "${wire_trust}").request_manual_press(millis());
            id(last_press_result).publish_state(std::string("manual: ") + garage::to_string(result));

ota:
  # Updates from the laptop over Wi-Fi, encrypted with the API's key: ESPHome
  # 2026.10 refuses a separate OTA key that differs from it.
  - platform: esphome

# Deliberately absent: web_server, captive_portal, mqtt.

switch:
  # Test mode when off: presses are judged and reported, the relay stays open.
  # Off after every boot and update; Roy turns it on.
  - platform: template
    id: armed
    name: Armed
    restore_mode: ALWAYS_OFF
    lambda: return garage_door::door(${allow_close}, "${wire_trust}").armed();
    turn_on_action:
      - lambda: garage_door::door(${allow_close}, "${wire_trust}").set_armed(true);
    turn_off_action:
      - lambda: garage_door::door(${allow_close}, "${wire_trust}").set_armed(false);
  # Manual mode (decisions/ADR-GD-004): allows a manual press with the door's
  # state unknown. Off after every boot and update, and by itself after 10 min.
  - platform: template
    id: manual
    name: Manual mode
    restore_mode: ALWAYS_OFF
    lambda: return garage_door::door(${allow_close}, "${wire_trust}").manual(millis());
    turn_on_action:
      - lambda: garage_door::door(${allow_close}, "${wire_trust}").set_manual(true, millis());
    turn_off_action:
      - lambda: garage_door::door(${allow_close}, "${wire_trust}").set_manual(false, millis());

button:
  # Restarts the controller only; it boots with the relay open and unarmed.
  - platform: restart
    name: Restart

sensor:
  # Seconds since the opener's last whole status; unknown until the first.
  # The laptop reports the light only while this is under 6 minutes.
  - platform: template
    name: Opener status age
    unit_of_measurement: s
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      auto &wire = garage_door::wire();
      if (!wire.heard()) {
        return NAN;
      }
      return static_cast<float>(millis() - wire.heard_at()) / 1000.0f;
  - platform: wifi_signal
    name: Wi-Fi signal
    update_interval: 60s
  - platform: uptime
    name: Uptime
    update_interval: 60s
  # How well the opener's wire is heard: counted since boot, only ever up.
  - platform: template
    name: Wire bytes received
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: 10s
    lambda: return static_cast<float>(garage_door::wire().health().bytes);
  - platform: template
    name: Wire bytes skipped
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: 10s
    lambda: return static_cast<float>(garage_door::wire().health().skipped);
  - platform: template
    name: Wire packets decoded
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: 10s
    lambda: return static_cast<float>(garage_door::wire().health().decoded);
  - platform: template
    name: Wire packets failed
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: 10s
    lambda: return static_cast<float>(garage_door::wire().health().failed);
  - platform: template
    name: Wire rolling-code gaps
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: 10s
    lambda: return static_cast<float>(garage_door::wire().health().gaps);
  - platform: template
    name: Wire framing errors
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: 10s
    lambda: return static_cast<float>(garage_door::wire_uart().trouble().framing);
  - platform: template
    name: Wire parity errors
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: 10s
    lambda: return static_cast<float>(garage_door::wire_uart().trouble().parity);
  - platform: template
    name: Wire overflows
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: 10s
    lambda: return static_cast<float>(garage_door::wire_uart().trouble().overflow);
  - platform: template
    name: Wire breaks
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: 10s
    lambda: return static_cast<float>(garage_door::wire_uart().trouble().breaks);

binary_sensor:
  # Each reed contact closes to ground when its magnet is near. GPIO34 and 35
  # are input-only with no internal pull-up; the 10 kΩ pull-ups are on the
  # board (docs/plan.md, section 2).
  - platform: gpio
    id: at_closed
    name: Fully closed
    pin:
      number: GPIO34
      mode: INPUT
      inverted: true
    filters:
      - delayed_on_off: 50ms
  - platform: gpio
    id: at_open
    name: Fully open
    pin:
      number: GPIO35
      mode: INPUT
      inverted: true
    filters:
      - delayed_on_off: 50ms

output:
  # The relay across terminals 1 and 2: the AQY212EH, or for the first test
  # Roy's relay module. ESPHome drives it off during setup; before that, from
  # reset, GPIO25 floats (not a strapping pin), which these inputs read as off.
  - platform: gpio
    id: press_output
    pin:
      number: GPIO25
      inverted: ${relay_active_low}

text_sensor:
  - platform: template
    id: door_state
    name: Door state
  - platform: template
    id: last_press_result
    name: Last press result
  - platform: template
    id: wire_status
    name: Opener status on the wire
  # The opener's light, as its last status said; read only, nothing here
  # switches it. How old that status is: "Opener status age".
  - platform: template
    id: opener_light
    name: Opener light
  - platform: version
    name: Firmware version
  - platform: debug
    reset_reason:
      name: Last restart reason

interval:
  # The logic decides; this only carries its answer to the pin and the network.
  - interval: 20ms
    then:
      - lambda: |-
          auto &door = garage_door::door(${allow_close}, "${wire_trust}");
          auto &wire = garage_door::wire();
          const uint32_t now = millis();
          garage_door::wire_uart().poll([&](uint8_t b) {
            switch (wire.feed(now, b)) {
              case garage::Heard::Nothing:
                break;
              case garage::Heard::Status: {
                const auto &s = wire.last();
                ESP_LOGI("wire", "status door=%u light=%d lock=%d rolling=0x%07x id=0x%010llx | %s",
                         static_cast<unsigned>(s.door), s.light, s.lock, static_cast<unsigned>(s.rolling),
                         static_cast<unsigned long long>(s.device_id), garage::to_hex(wire.packet()).c_str());
                static const char *const names[] = {"unknown", "open", "closed", "stopped", "opening", "closing"};
                const auto n = static_cast<unsigned>(s.door);
                id(wire_status).publish_state(n < 6 ? names[n] : "unknown");
                id(opener_light).publish_state(s.light ? "on" : "off");
                break;
              }
              case garage::Heard::Other:
                ESP_LOGI("wire", "other | %s", garage::to_hex(wire.packet()).c_str());
                break;
              case garage::Heard::Bad:
                ESP_LOGW("wire", "does not decode | %s", garage::to_hex(wire.packet()).c_str());
                break;
            }
          });
          // Nothing on the wire vanishes unseen: bytes outside any packet are logged too.
          if (wire.skipped() > 0) {
            ESP_LOGI("wire", "skipped %u bytes outside any packet | %s", static_cast<unsigned>(wire.skipped()),
                     wire.skipped_hex().c_str());
            wire.clear_skipped();
          }
          if (std::string("${state_from}") == "wire") {
            door.update_from_wire(now, wire.heard() ? wire.last().door : garage::WireState::Unknown,
                                  wire.heard() ? wire.heard_at() : now - 0x80000000U,
                                  wire.damaged_since_status());
          } else {
            door.update(now, id(at_closed).state, id(at_open).state);
          }
          if (door.output(now)) {
            id(press_output).turn_on();
          } else {
            id(press_output).turn_off();
          }
          const char *state = garage::to_string(door.state());
          if (!id(door_state).has_state() || id(door_state).state != state) {
            id(door_state).publish_state(state);
          }
