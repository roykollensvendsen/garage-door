#
# Copy to secrets.yaml (git-ignored) and fill in. CI checks the configuration
# against this file, so its shape must match what garage-door.yaml asks for.
#
# api_encryption_key: 32 random bytes, base64. Generate with
#   python -c "import base64, os; print(base64.b64encode(os.urandom(32)).decode())"
# The same key goes in the laptop's secret store for the MCP module.

wifi_ssid: "example-network"
wifi_password: "example-password"
# The example key spells "example-key-do-not-use-0123456!!": never use it.
api_encryption_key: "ZXhhbXBsZS1rZXktZG8tbm90LXVzZS0wMTIzNDU2ISE="
# OTA updates use api_encryption_key too (ESPHome 2026.10 requires the same key).
