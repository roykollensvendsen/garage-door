notes: >-
  The project's reference opener. One press steps the door open, stop, close,
  so the controller only presses when the door is known to be fully open or
  fully closed. Measure on a wire inserted through the orange lever; probe tips
  do not reach the contacts. The 30 VDC output reads about 1.1 V while idle
  (standby). Listed as untested until the controller itself has opened and
  closed the door. Terminals 0+2 carry about 10-11 V and show short bursts
  of traffic at each change of state, quiet in between, which suggests a
  Security+ 2.0-style status bus; not yet decoded.
