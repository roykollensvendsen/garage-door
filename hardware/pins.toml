#
# The one place the controller's wiring is decided. The schematic is generated
# from this file (scripts/schematic.py), and tests check that the firmware
# (firmware/garage-door.yaml) and the wiring diagram (hardware/harness.yaml)
# agree with it. Change a pin here first, then regenerate and fix whatever the
# tests name.

[board]
name = "SparkFun ESP32 Thing (DEV-13907)"

[gpio]
# Drives the PhotoMOS relay's LED; the relay's output closes opener terminals 1+2.
press = 25
# No reed contacts (Roy, 2026-11-06): the door state comes from the opener's
# own status on the data wire. GPIO34 and 35 are free for anyone who adds them.
# The opener's data wire (terminal 0), listen-only through a resistor divider
# for the first bench test (docs/plan.md). Input-only, not a strapping pin.
# Not in the schematic yet: it is added with the isolated input.
wire_rx = 36

[parts]
relay = "AQY212EH"          # Panasonic PhotoMOS, DIP-4, 60 V 0.5 A, AC/DC output
relay_led_resistor = "330"  # about 6 mA from 3.3 V

[bench_divider]
# The first, listen-only bench test on the opener's data wire (docs/plan.md,
# "First bench test"): terminal 0 -> top -> node A -> bottom -> terminal 2
# (ESP32 GND), node A -> series -> wire_rx, clamp diode to 3V3. Not isolated.
# Roy measured on the scope (2026-11-04): with 22k + 10k over 10k node A read
# 2.4 V mean, too close to the ESP32's input-high level, so the top is 22k
# alone (the second 10k jumpered): 3.17 V mean. The line's mean is about 10.1 V.
# Drawn by scripts/bench_divider.py; tests/test_bench_divider.py checks the levels.
top = ["22k"]               # Roy jumpers the 10k that sat in series here
bottom = "10k"
series = "1k"
clamp = "1N4148"            # cathode at 3V3; what Roy has for the first test. A Schottky
                            # (1N5819, BAT85) clamps lower and is the one for a permanent build
filter = "1n"               # GPIO36 to GND; with the ~7.9k feeding it, about 8 us
line_idle_min = 10.1        # volts, mean high on 0+2 on the scope (with 50 Hz ripple)
line_max = 15.0             # volts, assumed worst case
clamp_drop = 0.6            # 1N4148 at a fraction of a milliampere; a Schottky is about 0.3

[bench_relay]
# Roy's relay module for the first bench and door test (2026-11-04, from a
# photo); the AQY212EH in [parts] stays the part for the permanent build.
# Red board, Songle SRD-03VDC-SL-C, onboard driver transistor, flyback diode
# and LEDs. Drawn by scripts/bench_relay.py.
relay = "Songle SRD-03VDC-SL-C"
coil = "3 V, about 120 mA"
contacts = "10 A 250 VAC / 10 A 30 VDC"
# input screw terminal, left to right -> where it goes (Roy, 2026-11-04).
# CTH triggers on a high input, CTL on a low one. CTH is used: a low or
# floating GPIO (boot, crash, reset) leaves the relay open.
input = [
  { terminal = "VCC", to = "3V3" },
  { terminal = "GND", to = "GND" },
  { terminal = "CTH", to = "GPIO25" },
  { terminal = "CTL", to = "not connected" },
]
# output screw terminal -> where it goes; NC stays empty, so a dead module leaves the door alone
output = [
  { terminal = "COM", to = "opener terminal 1" },
  { terminal = "NO", to = "opener terminal 2" },
  { terminal = "NC", to = "not connected" },
]
active_low = false          # CTH: matches relay_active_low "false" in firmware/garage-door.yaml

[bench_breadboard]
# Roy's test board as built (2026-11-04): a half-size breadboard, rows 1-30,
# holes a-e of each row joined; "gnd" is the blue rail beside them. Each part
# runs from one hole to another; a diode's "to" is its cathode (black stripe).
# Drawn by scripts/bench_breadboard.py.
parts = [
  { what = "22k", from = "b1", to = "b5" },
  { what = "jumper", from = "a5", to = "b9", colour = "green" },
  { what = "10k", from = "d9", to = "gnd" },
  { what = "1k", from = "e9", to = "e13" },
  { what = "1N4148", from = "c13", to = "c17" },
  { what = "10n", from = "d13", to = "d15" },
  { what = "jumper", from = "e15", to = "gnd", colour = "grey" },
]
wires = [
  { colour = "red", at = "a1", to = "opener terminal 0" },
  { colour = "black", at = "gnd", to = "opener terminal 2" },
  { colour = "green", at = "b13", to = "scope probe (its ground clip on the black wire)" },
  { colour = "yellow", at = "a13", to = "ESP32 GPIO36 (not connected yet)" },
  { colour = "blue", at = "a17", to = "ESP32 3V3 (not connected yet)" },
  { colour = "black", at = "gnd", to = "ESP32 GND (not connected yet)" },
  { colour = "red", at = "17", to = "relay module VCC (row 17, hole not given; not connected yet)" },
  { colour = "black", at = "gnd", to = "relay module GND (not connected yet)" },
]
measured = [
  "Node A (row 9): 3.17 V mean.",
  "Row 13 (GPIO36) with the 10n: idle min about 2.7 V, 0.8 V peak to peak of 50 Hz ripple.",
  "Packets swing about 0 V to 3.4 V; min -240 mV during packets.",
]

[opto_input]
# The permanent, isolated input on the opener's data wire (docs/plan.md):
# terminal 0 -> led_resistor -> 6N136 pin 2, pin 3 -> terminal 2, reverse diode
# across the LED; pin 8 to 3V3 with a decoupling cap, pin 6 -> wire_rx with a
# pull-up. Inverts. Drawn by scripts/opto_input.py. Proposed, not built.
part = "6N136"
led_resistor = "10k"        # about 1 mA at 11.2 V; two in parallel if the output is not low enough
reverse_diode = "1N4148"
pull_up = "22k"             # one element of the 22k SIL network
decoupling = "100n"

[opener]
# LiftMaster LM80EVF terminals the relay output connects to (manual 114A4C095B, PDF p. 269).
terminals = [1, 2]
