[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "garage-door"
description = "Voice-controlled garage door: ESP32 + ESPHome on the opener's push-button input, driven by a local MCP module with confirmation and logging."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dynamic = ["version"]
dependencies = [
    "aioesphomeapi>=46.25",
    "mcp>=2.3",
]

[project.scripts]
garage-door = "garage_door.cli:main"
garage-door-mcp = "garage_door.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.13",
    "mypy>=1.11",
    "pyyaml>=6",
    "types-pyyaml>=6.0.12.20261103",
]

# One source for the version: the Git tag. A literal here would drift from it.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/garage_door/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/garage_door"]
# py.typed tells a consumer's type checker that these annotations are meant.
artifacts = ["src/garage_door/py.typed"]

[tool.ruff]
# Without this the package under src/ is sorted as a third-party import, and a
# freshly scaffolded repository fails its own import-order check.
src = ["src"]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# D203/D213 contradict D211/D212, which are kept; COM812 and ISC001 fight the
# formatter; CPY001 wants a header in every file, and the licence is one file;
# D401 wants an imperative first line, but a command's docstring is also its
# help text, and help reads as a description.
select = ["ALL"]
ignore = ["D203", "D213", "COM812", "ISC001", "CPY001", "D401"]

[tool.ruff.lint.per-file-ignores]
# A test's name is its docstring, its fixtures need no annotations, and a bare
# assert is the point of pytest.
"tests/*" = ["S101", "ANN", "D1", "PLR2004", "INP001", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["garage_door"]
omit = ["*/_version.py"]   # generated from the Git tag at build time

[tool.coverage.report]
show_missing = true
# The floor: below this the test run fails. The ratchet (quality.json) holds the
# level actually reached, so this only catches a drop the ratchet was told to allow.
fail_under = 95
exclude_also = ["if __name__ == .__main__.:"]

[dependency-groups]
docs = [
    "zensical==0.1.0",
]

# The shape of the code, checked by scripts/structure.py and held by the
# quality ratchet (scripts/ratchet.py, quality.json).
[tool.quality]
package = "src/garage_door"
# The most lines a module may have, per folder. Tools may be longer than the
# product's own code, which has to stay easy to review for safety.
max_lines = { "src" = 300, "firmware/door_logic" = 300, "firmware/sim" = 300, "scripts" = 400 }
# Where copied blocks are looked for: the product, not its tests.
duplication = ["src", "firmware/door_logic", "firmware/sim"]
block = 6

# The layers of docs/design.md, lowest first. A module may import, when it
# loads, only from lower layers: the core never reaches a driver, and a
# driver never reaches the MCP server.
[tool.quality.layers]
_version = 0        # generated from the Git tag; imports nothing
door = 1            # hardware abstraction: the door's states, the Device interface
phrases = 2         # magic phrases (ADR-GD-008), core like the service
service = 2         # core: confirm, refuse, log
manual = 3          # the manual press (ADR-GD-004), built on the core's rules
switches = 3        # arming and manual mode by voice (ADR-GD-006), the same way
esphome_device = 3  # drivers behind the Device interface: the real controller
simulator = 3       #   and the simulated one
settings = 3         # the MCP server's settings, read from the environment and files
server = 4          # adapters: the MCP server and the command line
cli = 4
# Layer 0 is the opener profiles (hardware/openers/*.yaml), data only so far.
